    html,body,#root{height:100%;margin:0;padding:0;}
    
    html, body {
      /* Prevents the entire viewport window from bouncing when pulled */
      overscroll-behavior-y: none;
      /* Disables the native magnifying glass / callout menu on long-press */
      -webkit-touch-callout: none;
      /* Ensures crisp tap execution across mobile interaction vectors */
      touch-action: manipulation;
      background:#080c10;
    }
    
        /* Google Fonts removed — native system typography enforced per spec §II.2 */
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .grid-bg {
          background-image:
            linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
          background-size: 32px 32px;
        }
        .card-dark {
          background: linear-gradient(180deg, #11161f 0%, #0d1218 100%);
          border: 1px solid rgba(255,255,255,0.06);
        }
        .num-tabular { font-variant-numeric: tabular-nums; }
        .tab-scroll { scrollbar-width: none; }
        .tab-scroll::-webkit-scrollbar { display: none; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinning { animation: spin 1s linear infinite; }
        @keyframes settings-slide-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes settings-fade-in { from { opacity: 0; } to { opacity: 1; } }
        .settings-slide { animation: settings-slide-in 220ms cubic-bezier(0.16, 1, 0.3, 1); }
        .safe-top { padding-top: max(env(safe-area-inset-top), 12px); }
        .safe-bottom-nav { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
        .safe-bottom-modal { padding-bottom: max(env(safe-area-inset-bottom), 12px); }
        * { -webkit-overflow-scrolling: touch; }
        button:active { transform: scale(0.97); transition: transform 100ms ease; }
        .bottom-nav {
          background: rgba(0,0,0,0.85);
          backdrop-filter: saturate(180%) blur(20px);
          -webkit-backdrop-filter: saturate(180%) blur(20px);
          border-top: 1px solid rgba(255,255,255,0.08);
        }
        @keyframes bottom-nav-in { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .bottom-nav-enter { animation: bottom-nav-in 300ms cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes settings-sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .settings-sheet { border-radius: 20px 20px 0 0; }
        .settings-sheet-enter { animation: settings-sheet-up 320ms cubic-bezier(0.16, 1, 0.3, 1); }
        .settings-sheet-dragging { transition: none !important; }
        .settings-sheet-spring { transition: transform 380ms cubic-bezier(0.16, 1, 0.3, 1); }
        .ticker-modal { border-radius: 20px 20px 0 0; animation: settings-sheet-up 300ms cubic-bezier(0.16, 1, 0.3, 1); }
        /* All Holdings bottom sheet: bounded height so it feels like a sheet,
           not a full-screen takeover. 80vh fallback; dynamic-viewport upgrade
           on iOS 15.4+ keeps a real top gap as the Safari chrome collapses.
           (env(safe-area-inset-top) is comfortably inside the remaining 20%.) */
        .holdings-sheet { max-height: 80vh; }
        @supports (height: 100dvh) { .holdings-sheet { max-height: 80dvh; } }
        @media (min-width: 768px) {
          .ticker-modal { border-radius: 24px; animation: ticker-modal-pop 200ms cubic-bezier(0.16, 1, 0.3, 1); }
          @keyframes ticker-modal-pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        }
        .settings-fade { animation: settings-fade-in 220ms ease-out; }
        @keyframes upload-fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
        .upload-fade-in { animation: upload-fade 280ms cubic-bezier(0.16, 1, 0.3, 1); }

        /* Closed-positions table: sticky ticker column with a hard boundary
           so scrolled cells slide cleanly underneath without bleeding through. */
        .closed-table .sticky-col {
          position: sticky;
          left: 0;
          z-index: 2;
          background: #0d1218;
          box-shadow: 1px 0 0 0 #27272a, 4px 0 6px -2px rgba(0, 0, 0, 0.6);
        }
        .closed-table .sticky-col-head {
          background: #11161f;
          border-bottom: 1px solid #27272a;
        }
        .closed-table .closed-row > td {
          border-bottom: 1px solid #18181b;
        }
        .closed-table .closed-row:hover > td:not(.sticky-col) {
          background: rgba(24, 24, 27, 0.4);
        }
        .closed-table .closed-row:hover > .sticky-col {
          background: #11161f;
        }

        /* Compact sticky header — slides down when scrolled past hero */
        .sticky-bar {
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          z-index: 35;
          background: rgba(0,0,0,0.88);
          backdrop-filter: saturate(180%) blur(20px);
          -webkit-backdrop-filter: saturate(180%) blur(20px);
          border-bottom: 1px solid rgba(255,255,255,0.07);
          transform: translateY(-100%);
          transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sticky-bar.is-visible {
          transform: translateY(0);
        }

        /* Improved bottom nav active pill */
        /* Privacy mode blur for sensitive number blocks */
        .privacy-blur {
          filter: blur(6px);
          user-select: none;
          pointer-events: none;
          transition: filter 200ms ease;
        }
        .nav-pill {
          position: absolute;
          bottom: 6px;
          left: 50%;
          transform: translateX(-50%);
          width: 4px;
          height: 4px;
          border-radius: 999px;
          background: #fbbf24;
          transition: width 200ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ── iPhone / iOS interaction fixes ──────────────────────────────────── */
        /* 1. Prevent auto-zoom when tapping any input on iPhone                  */
        /*    iOS Safari zooms the page when a focused <input> has font-size<16px */
        input, textarea, select { font-size: 16px !important; }
        /* 2. Eliminate the 300 ms tap delay & ghost highlight on all tappables   */
        button, a, label, [role="button"] {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        /* 3. Div/span overlays need cursor:pointer so iOS fires the onClick       */
        .ios-tap-backdrop { cursor: pointer; }

class ErrorBoundary extends React.Component {
    constructor(props) { 
        super(props); 
        this.state = { hasError: false, error: null, errorInfo: null }; 
    }
    static getDerivedStateFromError(error) { 
        return { hasError: true, error: error }; 
    }
    componentDidCatch(error, errorInfo) { 
        this.setState({ errorInfo: errorInfo });
        console.error('React Error Boundary Caught:', error, errorInfo);
    }
    render() {
        if (this.state.hasError) {
            return React.createElement('div', { 
                style: { 
                    position: 'fixed', inset: 0, zIndex: 9999, padding: '40px 20px', 
                    color: '#f87171', background: '#1a0a0a', minHeight: '100dvh', 
                    fontFamily: 'JetBrains Mono, monospace', fontSize: '12px', overflowY: 'auto' 
                } 
            },
                React.createElement('h2', { style: { color: '#ef4444', fontSize: '18px', marginBottom: '16px' } }, 'UI Crash Intercepted'),
                React.createElement('div', { style: { marginBottom: '16px', color: '#fca5a5', fontWeight: 600 } }, this.state.error && this.state.error.toString()),
                React.createElement('pre', { style: { whiteSpace: 'pre-wrap', color: '#a1a1aa', fontSize: '10px', lineHeight: 1.5 } }, this.state.errorInfo && this.state.errorInfo.componentStack),
                // The fix is usually a newer version: fetch it rather than reload the broken one from the cache.
                typeof ReloadLatestButton === 'function' && React.createElement(ReloadLatestButton, null),
                React.createElement('button', {
                    onClick: () => window.location.reload(),
                    style: { marginTop: '24px', padding: '12px 24px', background: 'rgba(239,68,68,0.2)', color: '#f87171', border: '1px solid rgba(239,68,68,0.4)', borderRadius: '8px', cursor: 'pointer' }
                }, 'Reload Application')
            );
        }
        return this.props.children;
    }
}
</script>
<script>
// Offline copy (docs/sw.js): opens the app with no signal and picks up a new build on the next open. The kill switch:
// set SW_ENABLED = false and every phone unregisters it and deletes its cache on its next open. Settings → Diagnostics
// → Offline copy turns it off on one phone (sw_off in localStorage).
const SW_ENABLED = true;
const SW_OFF_KEY = 'sw_off';
function swOff(){
  if(!('serviceWorker' in navigator))return Promise.resolve();
  return Promise.all([
    navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}),
    window.caches?caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('portfolio-app')===0;}).map(function(k){return caches.delete(k);}));}):null
  ]).catch(function(e){appLog('warn','Turning the offline copy off failed: '+(e&&e.message||e));});
}
function swOn(){
  if(!('serviceWorker' in navigator))return Promise.resolve(null);
  return navigator.serviceWorker.register('sw.js').catch(function(e){appLog('warn','Offline copy could not start: '+(e&&e.message||e));return null;});
}
(function(){
  if(!('serviceWorker' in navigator))return;
  var off=false;try{off=localStorage.getItem(SW_OFF_KEY)==='1';}catch(e){}
  if(!SW_ENABLED||off)swOff();else window.addEventListener('load',swOn);
})();
</script>
