name: Tests
on:
  pull_request:
  push:
    branches: [main]
  # Weekly on main too, so the date checks (tax year, exchange calendars) fail when they fall due, not at the next PR.
  schedule:
    - cron: '0 7 * * 1'
jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes about a minute. A hang (a stuck download) fails here instead of running for hours.
    timeout-minutes: 10
    env:
      # The render smoke test (tests/smoke.test.mjs) must run here, not be skipped.
      SMOKE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Kept out of package.json so the Cloudflare Worker build stays as it is. The four CDN packages are the exact
      # versions docs/index.html pins, served to the app in place of the CDN. acorn parses app.js for tests/hooks.test.cjs.
      - run: npm install --prefix "$RUNNER_TEMP/smoke" --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1 react@18.3.1 react-dom@18.3.1 xlsx@0.18.5 papaparse@5.4.1 acorn@8.12.1 acorn-walk@8.3.3
      - run: echo "NODE_PATH=$RUNNER_TEMP/smoke/node_modules" >> "$GITHUB_ENV"
      # The smoke test drives the Google Chrome already on the runner image. Downloading Playwright's own Chromium (with its
      # apt packages) hung for over 30 minutes on PR 112.
      - run: echo "SMOKE_CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
      - run: npm test
