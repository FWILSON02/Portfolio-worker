name: Deploy check
# The Home Screen app is only as new as what GitHub Pages serves. Twice a merge to main never reached the live site (a Pages
# run did not start) and the phone stayed on the old build. This runs after every merge to main, and hourly as a backstop:
#   1. it waits for the live site to serve main's build (the script tags in index.html, with APP_BUILD);
#   2. if that has not happened within 5 minutes, it asks GitHub Pages for a new build, which is the fix for a missed deploy;
#   3. if the live site still differs after 15 minutes, the run fails, which shows a red cross on the commit and emails Fergus.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
concurrency:
  group: deploy-check
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the live site to serve main's build
        run: |
          set -u
          url="https://fwilson02.github.io/Portfolio-worker/"
          tags() { grep -oE 'const APP_BUILD = [0-9]+;|<script src="[a-z]+\.js\?v=[0-9]+">' "$1"; }
          tags docs/index.html > "$RUNNER_TEMP/main.tags"
          echo "main serves:"; cat "$RUNNER_TEMP/main.tags"
          same() {
            curl -fsS --retry 2 -H 'Cache-Control: no-cache' "$url?nocache=$(date +%s)" -o "$RUNNER_TEMP/live.html" || return 1
            tags "$RUNNER_TEMP/live.html" > "$RUNNER_TEMP/live.tags"
            diff -q "$RUNNER_TEMP/main.tags" "$RUNNER_TEMP/live.tags" > /dev/null
          }
          # A commit that is already old (the hourly run) has had its few minutes: ask for a build straight away.
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          ask_at=300; [ "$age" -gt 1200 ] && ask_at=0
          asked=0; start=$(date +%s)
          while true; do
            if same; then echo "Live site matches main."; exit 0; fi
            waited=$(( $(date +%s) - start ))
            if [ "$asked" -eq 0 ] && [ "$waited" -ge "$ask_at" ]; then
              asked=1
              echo "::warning::Live site still differs from main after ${waited}s: asking GitHub Pages for a new build."
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || echo "::warning::The build request was refused."
            fi
            if [ "$waited" -ge 900 ]; then break; fi
            sleep 20
          done
          diff -u "$RUNNER_TEMP/main.tags" "$RUNNER_TEMP/live.tags" || true
          echo "::error::The live site is not serving main's build ${waited}s after the check started (a missed Pages deploy)."
          exit 1
